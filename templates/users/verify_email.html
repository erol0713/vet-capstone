{% extends 'base.html' %}
{% load static %}

{% block title %}Verify Email{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/pages/auth.css' %}" />
{% endblock %}

{% block content %}
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="auth-card">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">Verify your email</h2>
            <p class="text-muted">
              Enter the 6-digit code sent to {{ user.email }}.
            </p>
            <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                {{ form.code }}
              </div>
              <button class="btn btn-primary w-100" type="submit">Verify</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
