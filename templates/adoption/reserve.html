{% extends 'base.html' %}

{% block title %}Reserve Adoption{% endblock %}

{% block content %}
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="h5 mb-2">Reserve Adoption</h2>
            <p class="text-muted">Dog: {{ dog.name|default:"Unnamed Dog" }}</p>
            <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Preferred reservation date</label>
                {{ form.reservation_date }}
              </div>
              <button class="btn btn-primary w-100" type="submit">Submit Request</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
