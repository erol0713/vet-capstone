{% if request.user.is_authenticated and request.user.role == 'OWNER' %}
  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <i class="bi bi-grid"></i>
      <span>Dashboard</span>
    </a>
    <a href="{% url 'dogs_public_list' %}" class="{% if request.resolver_match.url_name == 'dogs_public_list' or request.resolver_match.url_name == 'dogs_public_detail' %}active{% endif %}">
      <i class="bi bi-heart"></i>
      <span>Dogs</span>
    </a>
    <a href="{% url 'adoption_my_requests' %}" class="{% if request.resolver_match.url_name == 'adoption_my_requests' or request.resolver_match.url_name == 'adoption_reserve' or request.resolver_match.url_name == 'adoption_reclaim' %}active{% endif %}">
      <i class="bi bi-journal-check"></i>
      <span>Requests</span>
    </a>
    <a href="{% url 'reports_public_list' %}" class="{% if request.resolver_match.url_name == 'reports_public_list' %}active{% endif %}">
      <i class="bi bi-megaphone"></i>
      <span>Reports</span>
    </a>
    <a href="{% url 'notifications_inbox' %}" class="{% if request.resolver_match.url_name == 'notifications_inbox' %}active{% endif %}">
      <i class="bi bi-bell"></i>
      <span>Notifications</span>
      {% if unread_notifications %}
        <span class="mobile-bottom-nav__badge">{{ unread_notifications }}</span>
      {% endif %}
    </a>
  </nav>
{% endif %}
