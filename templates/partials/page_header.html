<div class="page-header">
  <div>
    {% if eyebrow %}<div class="page-header-eyebrow">{{ eyebrow }}</div>{% endif %}
    <h1 class="page-header-title">{{ title }}</h1>
    {% if subtitle %}<p class="page-header-subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  {% if actions %}
    <div class="page-header-actions">{{ actions|safe }}</div>
  {% endif %}
</div>
